name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.25.x"
  SINGBOX_VERSION: "1.14.2"
  CORE_TAGS: "with_gvisor,badlinkname,tfogo_checklinkname0"

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Vet
        run: go vet ./core/... ./server/... ./ui/... ./mobile/... ./tools/...
      - name: Build server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -tags "badlinkname,tfogo_checklinkname0" \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o dist/tainavpn-server ./server/cmd/tainavpn-server
      - name: Smoke test
        run: |
          mkdir -p /tmp/tvpn
          TVPN_PUBLIC_HOST=127.0.0.1 TVPN_ADMIN_TOKEN=0123456789abcdef0123 TVPN_DATA_DIR=/tmp/tvpn \
          TVPN_SOCKS_PORT=21080 TVPN_API_LISTEN=127.0.0.1:18090 TVPN_OPEN_REGISTRATION=true ./dist/tainavpn-server &
          sleep 2
          curl -fsS http://127.0.0.1:18090/api/v1/info
          SUB=$(curl -fsS -X POST -d '{"device":"ci"}' http://127.0.0.1:18090/api/v1/register | python3 -c 'import json,sys;print(json.load(sys.stdin)["subscription_url"])')
          echo "sub: $SUB"
          CFG=$(curl -fsS "$SUB")
          echo "$CFG"
          sleep 2
          U=$(echo "$CFG" | python3 -c 'import json,sys;p=json.load(sys.stdin)["proxies"][0];print(p["username"]+":"+p["password"])')
          curl -fsS --max-time 20 -x "socks5h://$U@127.0.0.1:21080" https://www.google.com -o /dev/null -w "via socks: %{http_code}\n"
          if curl -s --max-time 5 -x "socks5h://bad:creds@127.0.0.1:21080" https://www.google.com -o /dev/null; then echo "auth not enforced!"; exit 1; fi
          curl -fsS -H "Authorization: Bearer 0123456789abcdef0123" http://127.0.0.1:18090/api/admin/users
          echo "$CFG" > /tmp/sub.json
      - name: End-to-end test of the client config (TUN -> SOCKS5 server)
        timeout-minutes: 3
        run: |
          go build -tags "${CORE_TAGS}" -ldflags "-checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" -o /tmp/runconfig ./tools/runconfig
          node -e '
            const m = require("./ui/app.js");
            const p = JSON.parse(require("fs").readFileSync("/tmp/sub.json")).proxies[0];
            m._setStore({ profiles: [], bypassLan: true, mode: "tun" }, "linux");
            require("fs").writeFileSync("/tmp/client.json", m.buildConfig(p));
          '
          (TVPN_PUBLIC_HOST=127.0.0.1 TVPN_ADMIN_TOKEN=0123456789abcdef0123 TVPN_DATA_DIR=/tmp/tvpn \
            TVPN_SOCKS_PORT=21080 TVPN_API_LISTEN=127.0.0.1:18090 ./dist/tainavpn-server > /tmp/server.log 2>&1 &) || true
          sleep 2
          sudo /tmp/runconfig /tmp/client.json > /tmp/client.log 2>&1 &
          sleep 4
          ip addr | grep -A2 tun || true
          # no -x flag: traffic is captured by TUN and must go through the SOCKS5 server
          curl -fsS --max-time 20 https://www.google.com -o /dev/null -w "through tun: %{http_code}\n"
          sudo pkill -INT runconfig; sleep 2
          cat /tmp/client.log | tail -40
          grep -q "outbound/socks\[proxy\]" /tmp/client.log || { echo "::error::traffic did not go through the SOCKS5 outbound"; exit 1; }
          grep -q "hijack\|dns" /tmp/client.log && echo "dns ok"
      - uses: actions/upload-artifact@v4
        with:
          name: tainavpn-server-linux-amd64
          path: dist/tainavpn-server
      - uses: actions/upload-artifact@v4
        with:
          name: go-modules
          path: |
            go.mod
            go.sum

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Resources (icon + admin manifest)
        run: |
          go install github.com/akavel/rsrc@latest
          rsrc -manifest desktop/build/app.manifest -ico desktop/build/icon.ico -arch amd64 -o desktop/rsrc_windows_amd64.syso
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"; [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="dev-${GITHUB_SHA::7}"
          go build -trimpath -tags "desktop,production,${CORE_TAGS}" \
            -ldflags "-s -w -H windowsgui -checklinkname=0 -X main.AppVersion=${VERSION} -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o dist/Tainavpn.exe ./desktop
      - uses: actions/upload-artifact@v4
        with:
          name: tainavpn-windows-amd64
          path: dist/Tainavpn.exe

  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install GTK/WebKit
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Resolve modules
        run: go mod tidy
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION="${GITHUB_REF_NAME}"; [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="dev-${GITHUB_SHA::7}"
          go build -trimpath -tags "desktop,production,webkit2_41,${CORE_TAGS}" \
            -ldflags "-s -w -checklinkname=0 -X main.AppVersion=${VERSION} -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o dist/tainavpn ./desktop
          cp desktop/build/icon.png dist/tainavpn.png
          cp desktop/linux/* dist/
          tar -C dist -czf tainavpn-linux-amd64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: tainavpn-linux-amd64
          path: tainavpn-linux-amd64.tar.gz

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Resolve modules
        run: |
          set -o pipefail
          go version | tee -a "$RUNNER_TEMP/out.log"
          go mod tidy 2>&1 | tee -a "$RUNNER_TEMP/out.log"
          go get golang.org/x/mobile/bind@latest 2>&1 | tee -a "$RUNNER_TEMP/out.log"
      - name: Install gomobile
        run: |
          set -o pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest 2>&1 | tee -a "$RUNNER_TEMP/out.log"
          go install golang.org/x/mobile/cmd/gobind@latest 2>&1 | tee -a "$RUNNER_TEMP/out.log"
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Build Go library (AAR)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          set -o pipefail
          gomobile bind -v -target=android/arm64,android/arm,android/amd64 -androidapi 24 \
            -javapkg com.tainavpn -tags "${CORE_TAGS}" -trimpath \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o android/app/libs/tainacore.aar ./mobile 2>&1 | tee -a "$RUNNER_TEMP/out.log"
          ls -la android/app/libs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export APP_VERSION="${GITHUB_REF_NAME}"; fi
          export APP_VERSION_CODE="${GITHUB_RUN_NUMBER}"
          gradle -p android assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          test ${PIPESTATUS[0]} -eq 0
          mkdir -p dist
          for f in android/app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" | sed -e 's/^app-/tainavpn-/' -e 's/-release//')
            cp "$f" "dist/$n"
          done
          ls -la dist
      - name: Report errors
        if: failure()
        run: |
          tail -n 30 "$RUNNER_TEMP/out.log" 2>/dev/null | while IFS= read -r l; do echo "::error::$l"; done || true
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 "$RUNNER_TEMP/gradle.log" 2>/dev/null | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: tainavpn-android
          path: dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, desktop-windows, desktop-linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir -p out
          cp artifacts/tainavpn-windows-amd64/Tainavpn.exe out/Tainavpn-windows-amd64.exe
          cp artifacts/tainavpn-linux-amd64/tainavpn-linux-amd64.tar.gz out/
          cp artifacts/tainavpn-android/*.apk out/
          cp artifacts/tainavpn-server-linux-amd64/tainavpn-server out/tainavpn-server-linux-amd64
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
