name: Build

# Каждый push в main собирает и тестирует всё.
# Релиз создаётся автоматически, когда в файле VERSION появляется новый номер версии.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.25.x"
  SINGBOX_VERSION: "1.14.2"
  CORE_TAGS: "with_gvisor,badlinkname,tfogo_checklinkname0"
  # last golang.org/x/mobile commit that still supports Go 1.25
  XMOBILE: "1960c775504c"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \n\r' < VERSION)
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must look like 1.2.3"; exit 1; }
          IFS=. read -r MA MI PA <<< "$V"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "code=$((MA*10000 + MI*100 + PA))" >> $GITHUB_OUTPUT
          REL=false
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || REL=true
          fi
          echo "release=$REL" >> $GITHUB_OUTPUT
          echo "version $V, release: $REL"

  changes:
    # did this push touch the server? (decides whether to deploy it)
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.c.outputs.server }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: c
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then echo "server=false" >> $GITHUB_OUTPUT; exit 0; fi
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(server/|bot/|deploy/|go\.mod$|\.github/workflows/deploy\.yml$)'; then
            CHANGED=true
          else
            CHANGED=false
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null | head -50 || true
          echo "server changed: $CHANGED"
          echo "server=$CHANGED" >> $GITHUB_OUTPUT

  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Vet
        run: |
          go vet ./core/... ./server/... ./bot/... ./ui/... ./mobile/... ./tools/...
          go test -tags "${CORE_TAGS}" -ldflags "-checklinkname=0" -run TestPing ./core/
          # the desktop apps serve only embedded files: everything index.html loads must be embedded
          go test ./ui/
      - name: Build server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o dist/tainavpn-server ./server/cmd/tainavpn-server
      - name: Start an upstream SOCKS5 proxy (stands in for a purchased proxy)
        run: |
          go build -tags "${CORE_TAGS}" -ldflags "-checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" -o /tmp/runconfig ./tools/runconfig
          cat > /tmp/upstream.json <<'EOF'
          {"inbounds":[{"type":"socks","listen":"127.0.0.1","listen_port":21080,"users":[{"username":"up","password":"pp"}]}],
           "outbounds":[{"type":"direct"}]}
          EOF
          # run as "nobody" so the client TUN test below can exclude it by uid
          (sudo -u nobody /tmp/runconfig /tmp/upstream.json > /tmp/upstream.log 2>&1 &)
          sleep 2
          curl -fsS --max-time 20 -x socks5h://up:pp@127.0.0.1:21080 https://www.google.com -o /dev/null -w "upstream ok: %{http_code}\n"
      - name: Smoke test (proxies from folder, links issued through the bot API)
        run: |
          mkdir -p /tmp/tvpn/proxies
          cat > /tmp/tvpn/proxies/list.txt <<'EOF'
          # comment
          up:pp@127.0.0.1:21080
          wrong:creds@127.0.0.1:21080
          garbage
          EOF
          TVPN_ADMIN_TOKEN=0123456789abcdef0123 TVPN_BOT_SECRET=botsecret0123 TVPN_DATA_DIR=/tmp/tvpn TVPN_PROXIES_DIR=/tmp/tvpn/proxies \
          TVPN_PUBLIC_URL=http://127.0.0.1:18090 TVPN_API_LISTEN=127.0.0.1:18090 ./dist/tainavpn-server > /tmp/server.log 2>&1 &
          sleep 4
          curl -fsS http://127.0.0.1:18090/api/v1/info
          # app self-registration is gone, admin panel moved
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18090/api/v1/register)" != 200 ] || { echo "::error::register must be removed"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/adminadminadmin)" = 200 ] || { echo "::error::admin panel not at /adminadminadmin"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/panel)" != 200 ] || { echo "::error::old admin path still works"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/ios)" != 200 ] || { echo "::error::iOS page must be disabled"; exit 1; }
          # bot API: wrong secret and requests through nginx are refused
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer nope' -d '{"telegram_id":1}' http://127.0.0.1:18090/api/bot/subscription)" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer botsecret0123' -H 'X-Real-IP: 1.2.3.4' -d '{"telegram_id":1}' http://127.0.0.1:18090/api/bot/subscription)" = 404 ]
          for i in 1 2 3; do
            SUB=$(curl -fsS -X POST -H 'Authorization: Bearer botsecret0123' -d "{\"telegram_id\":$i,\"name\":\"ci$i\"}" http://127.0.0.1:18090/api/bot/subscription | python3 -c 'import json,sys;print(json.load(sys.stdin)["subscription_url"])')
            CFG=$(curl -fsS "$SUB")
            echo "$CFG"
            # every user must get the working proxy from the folder, never the dead one
            echo "$CFG" | python3 -c 'import json,sys;p=json.load(sys.stdin)["proxies"][0];assert (p["server"],p["port"],p["username"])==("127.0.0.1",21080,"up"),p'
          done
          # same Telegram user -> same link; rotate -> new link, old one stops working
          A=$(curl -fsS -X POST -H 'Authorization: Bearer botsecret0123' -d '{"telegram_id":1}' http://127.0.0.1:18090/api/bot/subscription | python3 -c 'import json,sys;print(json.load(sys.stdin)["subscription_url"])')
          B=$(curl -fsS -X POST -H 'Authorization: Bearer botsecret0123' -d '{"telegram_id":1,"rotate":true}' http://127.0.0.1:18090/api/bot/subscription | python3 -c 'import json,sys;print(json.load(sys.stdin)["subscription_url"])')
          [ "$A" != "$B" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "$A")" = 404 ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "$B")" = 200 ] || { echo "::error::rotate failed"; exit 1; }
          # country of the upstream proxy is detected through the proxy itself (runner is in the US)
          for i in $(seq 1 20); do
            C=$(curl -fsS -H "Authorization: Bearer 0123456789abcdef0123" http://127.0.0.1:18090/api/admin/proxies | python3 -c 'import json,sys;print(" ".join(p.get("country","") for p in json.load(sys.stdin)["proxies"] if p["username"]=="up"))')
            [ -n "$C" ] && break; sleep 2
          done
          echo "detected country: $C"
          [ -n "$C" ] || { echo "::error::country was not detected"; cat /tmp/server.log; exit 1; }
          CFG=$(curl -fsS "$SUB")
          echo "$CFG" | python3 -c 'import json,sys;p=json.load(sys.stdin)["proxies"];print(p);assert len(p)==1 and p[0]["country"] and p[0]["name"].split()[1]'
          echo "$CFG" > /tmp/sub.json
          cat /tmp/server.log
      - name: Telegram bot test (fake Telegram API)
        timeout-minutes: 3
        run: |
          go build -o /tmp/tainavpn-bot ./bot
          mkdir -p /tmp/dl && echo "fake apk" > /tmp/dl/Tainavpn-0.0.0-android.apk
          cd /tmp && python3 "$GITHUB_WORKSPACE/tools/fake_telegram/fake_tg.py" 18199 ru &
          sleep 1
          cd /tmp && TVPN_BOT_TOKEN=TEST TVPN_BOT_SECRET=botsecret0123 TVPN_TG_API=http://127.0.0.1:18199 \
            TVPN_SERVER_API=http://127.0.0.1:18090 TVPN_DOWNLOADS_DIR=/tmp/dl /tmp/tainavpn-bot > /tmp/bot.log 2>&1 &
          sleep 15
          cat /tmp/bot.log
          python3 - <<'EOF'
          import json
          calls = [json.loads(l) for l in open("/tmp/calls.jsonl")]
          msgs = [c["text"] for c in calls if c["method"] == "sendMessage"]
          docs = [c for c in calls if c["method"] == "sendDocument"]
          for m in msgs: print("MSG:", m[:120].replace("\n", " | "))
          assert any("Tainavpn" in m for m in msgs), "no welcome"
          links = [m for m in msgs if "/sub/" in m]
          assert len(links) >= 2, "bot did not send subscription links"
          assert any(d.get("has_file") for d in docs), "app file was not uploaded"
          assert any(d.get("document") == "FILE123" for d in docs), "cached file_id was not reused"
          print("bot ok")
          EOF
      - name: End-to-end test of the client config (TUN -> proxy from folder)
        timeout-minutes: 3
        run: |
          node -e '
            const m = require("./ui/app.js");
            const p = JSON.parse(require("fs").readFileSync("/tmp/sub.json")).proxies[0];
            m._setStore({ profiles: [], bypassLan: true, mode: "tun" }, "linux");
            const cfg = JSON.parse(m.buildConfig(p));
            // keep the runner reachable for GitHub during the test
            delete cfg.inbounds[0].strict_route;
            // the upstream proxy runs on this machine as "nobody": keep it out of the TUN
            cfg.inbounds[0].exclude_uid = [65534];
            require("fs").writeFileSync("/tmp/client.json", JSON.stringify(cfg, null, 2));
          '
          finish() {
            code=$?
            sudo pkill -INT -f "runconfig /tmp/client.json" || true
            sleep 2
            if [ $code -ne 0 ]; then
              echo "::error::client log:%0A$(head -c 6000 /tmp/client.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            fi
            tail -n 40 /tmp/client.log
          }
          trap finish EXIT
          sudo timeout 90 /tmp/runconfig /tmp/client.json > /tmp/client.log 2>&1 &
          sleep 5
          ip addr | grep -A3 tun || true
          # no -x flag: traffic is captured by TUN and must go through the upstream proxy
          curl -fsS --max-time 20 https://www.google.com -o /dev/null -w "through tun: %{http_code}\n"
          sudo pkill -INT -f "runconfig /tmp/client.json"; sleep 2
          grep -q "outbound/socks\[proxy\]" /tmp/client.log || { echo "::error::traffic did not go through the proxy"; exit 1; }
          grep -q "inbound connection" /tmp/upstream.log || { echo "::error::upstream proxy saw no connections"; exit 1; }

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Resources (icon + admin manifest)
        run: |
          go install github.com/akavel/rsrc@latest
          rsrc -manifest desktop/build/app.manifest -ico desktop/build/icon.ico -arch amd64 -o desktop/rsrc_windows_amd64.syso
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -tags "desktop,production,${CORE_TAGS}" \
            -ldflags "-s -w -H windowsgui -checklinkname=0 -X main.AppVersion=${VERSION} -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o "dist/Tainavpn-${VERSION}-windows-x64.exe" ./desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          retention-days: 3

  ubuntu:
    needs: version
    # built on 22.04 so the package also runs on Ubuntu 22.04 (older glibc); works on 24.04 too
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install GTK/WebKit
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Resolve modules
        run: go mod tidy
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          go build -trimpath -tags "desktop,production,webkit2_41,${CORE_TAGS}" \
            -ldflags "-s -w -checklinkname=0 -X main.AppVersion=${VERSION} -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o build/tainavpn ./desktop
      - name: Package .deb
        run: |
          P=pkg
          install -Dm755 build/tainavpn $P/usr/bin/tainavpn
          install -Dm644 desktop/linux/tainavpn.desktop $P/usr/share/applications/tainavpn.desktop
          install -Dm644 desktop/build/icon.png $P/usr/share/icons/hicolor/512x512/apps/tainavpn.png
          # polkit: no password prompt for the VPN's DNS settings (24.04: rules.d, 22.04: pkla)
          install -Dm644 desktop/linux/50-tainavpn.rules $P/usr/share/polkit-1/rules.d/50-tainavpn.rules
          install -Dm644 desktop/linux/tainavpn.pkla $P/var/lib/polkit-1/localauthority/10-vendor.d/tainavpn.pkla
          mkdir -p $P/DEBIAN
          cat > $P/DEBIAN/control <<EOF
          Package: tainavpn
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Tainavpn <noreply@tainavpn.local>
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libcap2-bin
          Recommends: pkexec | policykit-1
          Section: net
          Priority: optional
          Installed-Size: $(du -sk $P/usr | cut -f1)
          Description: Tainavpn - весь трафик через прокси
           Отправляет трафик устройства в SOCKS5/HTTP-прокси (ядро sing-box).
          EOF
          sed -i 's/^          //' $P/DEBIAN/control
          cat > $P/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          # TUN mode needs network admin rights; grant them to the binary instead of running as root
          setcap cap_net_admin,cap_net_bind_service,cap_net_raw+ep /usr/bin/tainavpn || true
          command -v update-desktop-database >/dev/null && update-desktop-database -q || true
          exit 0
          EOF
          sed -i 's/^          //' $P/DEBIAN/postinst
          chmod 755 $P/DEBIAN/postinst
          mkdir -p dist
          dpkg-deb --root-owner-group --build $P "dist/tainavpn_${VERSION}_amd64.deb"
          dpkg-deb --info "dist/tainavpn_${VERSION}_amd64.deb"
      - name: Test install
        run: |
          sudo apt-get install -y "./dist/tainavpn_${VERSION}_amd64.deb"
          getcap /usr/bin/tainavpn | grep -q cap_net_admin
          # polkit directories are root-only
          sudo test -f /usr/share/polkit-1/rules.d/50-tainavpn.rules
          sudo test -f /var/lib/polkit-1/localauthority/10-vendor.d/tainavpn.pkla
          dpkg -L tainavpn
          test -f /usr/share/applications/tainavpn.desktop
          echo "installed ok"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: dist/*.deb
          retention-days: 3

  android:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Resolve modules
        run: |
          set -o pipefail
          go mod tidy 2>&1 | tee -a "$RUNNER_TEMP/out.log"
          go get golang.org/x/mobile/bind@${XMOBILE} 2>&1 | tee -a "$RUNNER_TEMP/out.log"
      - name: Install gomobile
        run: |
          set -o pipefail
          go install golang.org/x/mobile/cmd/gomobile@${XMOBILE} 2>&1 | tee -a "$RUNNER_TEMP/out.log"
          go install golang.org/x/mobile/cmd/gobind@${XMOBILE} 2>&1 | tee -a "$RUNNER_TEMP/out.log"
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Build Go library (AAR)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          set -o pipefail
          gomobile bind -v -target=android/arm64,android/arm,android/amd64 -androidapi 24 \
            -javapkg com.tainavpn -tags "${CORE_TAGS}" -trimpath \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o android/app/libs/tainacore.aar ./mobile 2>&1 | tee -a "$RUNNER_TEMP/out.log"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          APP_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          gradle -p android assembleRelease assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          test ${PIPESTATUS[0]} -eq 0
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Tainavpn-${VERSION}-android.apk"
          ls -la dist
      - name: Report errors
        if: failure()
        run: |
          grep -v "go: downloading\|go: finding\|go: found\|^go: upgraded\|^go: added" "$RUNNER_TEMP/out.log" 2>/dev/null | tail -n 30 | while IFS= read -r l; do echo "::error::$l"; done || true
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 "$RUNNER_TEMP/gradle.log" 2>/dev/null | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  android-test:
    # real Android emulator: VPN + "Private DNS" strict mode
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android-debug
          path: .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test SOCKS5 proxy on the host (10.0.2.2:21080 from the emulator)
        run: |
          nohup python3 tools/android_test/socks5_server.py 21080 up pp > /tmp/socks.log 2>&1 &
          sleep 1
          curl -fsS --max-time 15 -x socks5h://up:pp@127.0.0.1:21080 https://www.google.com -o /dev/null -w "proxy ok %{http_code}\n"
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # first with Private DNS off (baseline), then in strict mode like on the user's phone
          script: PDNS_MODE=off bash tools/android_test/run.sh && PDNS_MODE=opportunistic bash tools/android_test/run.sh && PDNS_MODE=hostname bash tools/android_test/run.sh
      - name: Proxy log
        if: always()
        run: |
          echo "--- connections through the test proxy ---"
          sort /tmp/socks.log | uniq -c | sort -rn | head -40
          echo "::warning::proxy connections%0A$(sort /tmp/socks.log | uniq -c | sort -rn | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')"

  release:
    needs: [version, server, windows, ubuntu, android, android-test]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Remove old test builds (nightly)
        run: |
          gh release delete nightly -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
      - name: Publish release
        run: |
          ls -la artifacts
          cat > notes.md <<EOF
          ## Tainavpn ${VERSION}

          | Система | Файл |
          |---|---|
          | Windows 10/11 (64-bit) | \`Tainavpn-${VERSION}-windows-x64.exe\` — запускается без установки, попросит права администратора |
          | Android 7.0+ | \`Tainavpn-${VERSION}-android.apk\` |
          | Ubuntu 22.04 / 24.04 | \`tainavpn_${VERSION}_amd64.deb\` — открыть двойным кликом или \`sudo apt install ./tainavpn_${VERSION}_amd64.deb\` |

          Ядро: sing-box ${SINGBOX_VERSION}.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "v${VERSION}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Tainavpn ${VERSION}" --notes-file notes.md --latest \
            artifacts/Tainavpn-${VERSION}-windows-x64.exe \
            artifacts/Tainavpn-${VERSION}-android.apk \
            artifacts/tainavpn_${VERSION}_amd64.deb
      - name: Upload the apps to the server (the Telegram bot sends them to users)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
          REMOTE_DIR: ${{ vars.VPS_DIR || '~/tainavpn' }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ]; then echo "VPS secrets are not set, skipping"; exit 0; fi
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/id_deploy -p ${PORT:-22} $USER@$HOST"
          DIR=$($SSH "mkdir -p $REMOTE_DIR/downloads && cd $REMOTE_DIR/downloads && pwd")
          scp -i ~/.ssh/id_deploy -P "${PORT:-22}" \
            artifacts/Tainavpn-${VERSION}-windows-x64.exe artifacts/Tainavpn-${VERSION}-android.apk artifacts/tainavpn_${VERSION}_amd64.deb \
            "$USER@$HOST:$DIR/"
          # keep only the current version
          $SSH "cd '$DIR' && ls | grep -v -e '${VERSION}' | xargs -r rm -f && ls -la"
      - name: Delete workflow artifacts (they are in the release now)
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true; done

  deploy:
    # server code changed and all server tests passed -> update the VPS
    needs: [changes, server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
