name: Build

# Каждый push в main собирает и тестирует всё.
# Релиз создаётся автоматически, когда в файле VERSION появляется новый номер версии.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.25.x"
  SINGBOX_VERSION: "1.14.2"
  CORE_TAGS: "with_gvisor,badlinkname,tfogo_checklinkname0"
  # last golang.org/x/mobile commit that still supports Go 1.25
  XMOBILE: "1960c775504c"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \n\r' < VERSION)
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must look like 1.2.3"; exit 1; }
          IFS=. read -r MA MI PA <<< "$V"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "code=$((MA*10000 + MI*100 + PA))" >> $GITHUB_OUTPUT
          REL=false
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || REL=true
          fi
          echo "release=$REL" >> $GITHUB_OUTPUT
          echo "version $V, release: $REL"

  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Vet
        run: go vet ./core/... ./server/... ./ui/... ./mobile/... ./tools/...
      - name: Build server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o dist/tainavpn-server ./server/cmd/tainavpn-server
      - name: Start an upstream SOCKS5 proxy (stands in for a purchased proxy)
        run: |
          go build -tags "${CORE_TAGS}" -ldflags "-checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" -o /tmp/runconfig ./tools/runconfig
          cat > /tmp/upstream.json <<'EOF'
          {"inbounds":[{"type":"socks","listen":"127.0.0.1","listen_port":21080,"users":[{"username":"up","password":"pp"}]}],
           "outbounds":[{"type":"direct"}]}
          EOF
          # run as "nobody" so the client TUN test below can exclude it by uid
          (sudo -u nobody /tmp/runconfig /tmp/upstream.json > /tmp/upstream.log 2>&1 &)
          sleep 2
          curl -fsS --max-time 20 -x socks5h://up:pp@127.0.0.1:21080 https://www.google.com -o /dev/null -w "upstream ok: %{http_code}\n"
      - name: Smoke test (proxies from folder)
        run: |
          mkdir -p /tmp/tvpn/proxies
          cat > /tmp/tvpn/proxies/list.txt <<'EOF'
          # comment
          up:pp@127.0.0.1:21080
          wrong:creds@127.0.0.1:21080
          garbage
          EOF
          TVPN_ADMIN_TOKEN=0123456789abcdef0123 TVPN_DATA_DIR=/tmp/tvpn TVPN_PROXIES_DIR=/tmp/tvpn/proxies \
          TVPN_API_LISTEN=127.0.0.1:18090 TVPN_OPEN_REGISTRATION=true ./dist/tainavpn-server > /tmp/server.log 2>&1 &
          sleep 4
          curl -fsS http://127.0.0.1:18090/api/v1/info
          for i in 1 2 3; do
            SUB=$(curl -fsS -X POST -d "{\"device\":\"ci$i\"}" http://127.0.0.1:18090/api/v1/register | python3 -c 'import json,sys;print(json.load(sys.stdin)["subscription_url"])')
            CFG=$(curl -fsS "$SUB")
            echo "$CFG"
            # every user must get the working proxy from the folder, never the dead one
            echo "$CFG" | python3 -c 'import json,sys;p=json.load(sys.stdin)["proxies"][0];assert (p["server"],p["port"],p["username"])==("127.0.0.1",21080,"up"),p'
          done
          # country of the upstream proxy is detected through the proxy itself (runner is in the US)
          for i in $(seq 1 20); do
            C=$(curl -fsS -H "Authorization: Bearer 0123456789abcdef0123" http://127.0.0.1:18090/api/admin/proxies | python3 -c 'import json,sys;print(" ".join(p.get("country","") for p in json.load(sys.stdin)["proxies"] if p["username"]=="up"))')
            [ -n "$C" ] && break; sleep 2
          done
          echo "detected country: $C"
          [ -n "$C" ] || { echo "::error::country was not detected"; cat /tmp/server.log; exit 1; }
          CFG=$(curl -fsS "$SUB")
          echo "$CFG" | python3 -c 'import json,sys;p=json.load(sys.stdin)["proxies"];print(p);assert len(p)==1 and p[0]["country"] and p[0]["name"].split()[1]'
          echo "$CFG" > /tmp/sub.json
          KEY=${SUB##*/sub/}
          echo "$KEY" > /tmp/key
          # iPhone formats: base64 share-link list and a full sing-box profile
          LINKS=$(curl -fsS "http://127.0.0.1:18090/sub/$KEY/links" | base64 -d)
          echo "links: $LINKS"
          [[ "$LINKS" == "socks://up:pp@127.0.0.1:21080#"* ]] || { echo "::error::unexpected share link: $LINKS"; exit 1; }
          curl -fsS "http://127.0.0.1:18090/sub/$KEY/singbox" > /tmp/ios-profile.json
          curl -fsS -o /dev/null http://127.0.0.1:18090/ios
          curl -fsS -H "Authorization: Bearer 0123456789abcdef0123" http://127.0.0.1:18090/api/admin/proxies
          cat /tmp/server.log
      - name: End-to-end test of the client config (TUN -> proxy from folder)
        timeout-minutes: 3
        run: |
          node -e '
            const m = require("./ui/app.js");
            const p = JSON.parse(require("fs").readFileSync("/tmp/sub.json")).proxies[0];
            m._setStore({ profiles: [], bypassLan: true, mode: "tun" }, "linux");
            const cfg = JSON.parse(m.buildConfig(p));
            // keep the runner reachable for GitHub during the test
            delete cfg.inbounds[0].strict_route;
            // the upstream proxy runs on this machine as "nobody": keep it out of the TUN
            cfg.inbounds[0].exclude_uid = [65534];
            require("fs").writeFileSync("/tmp/client.json", JSON.stringify(cfg, null, 2));
          '
          finish() {
            code=$?
            sudo pkill -INT -f "runconfig /tmp/client.json" || true
            sleep 2
            if [ $code -ne 0 ]; then
              echo "::error::client log:%0A$(head -c 6000 /tmp/client.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            fi
            tail -n 40 /tmp/client.log
          }
          trap finish EXIT
          sudo timeout 90 /tmp/runconfig /tmp/client.json > /tmp/client.log 2>&1 &
          sleep 5
          ip addr | grep -A3 tun || true
          # no -x flag: traffic is captured by TUN and must go through the upstream proxy
          curl -fsS --max-time 20 https://www.google.com -o /dev/null -w "through tun: %{http_code}\n"
          sudo pkill -INT -f "runconfig /tmp/client.json"; sleep 2
          grep -q "outbound/socks\[proxy\]" /tmp/client.log || { echo "::error::traffic did not go through the proxy"; exit 1; }
          grep -q "inbound connection" /tmp/upstream.log || { echo "::error::upstream proxy saw no connections"; exit 1; }
      - name: End-to-end test of the iPhone profile (/sub/<key>/singbox)
        timeout-minutes: 3
        run: |
          python3 - <<'EOF'
          import json
          cfg = json.load(open("/tmp/ios-profile.json"))
          cfg["inbounds"][0]["exclude_uid"] = [65534]   # upstream proxy runs on this machine as "nobody"
          cfg["log"] = {"level": "info"}
          json.dump(cfg, open("/tmp/ios-client.json", "w"), indent=2)
          EOF
          finish() {
            code=$?
            sudo pkill -INT -f "runconfig /tmp/ios-client.json" || true
            sleep 2
            [ $code -eq 0 ] || echo "::error::ios profile log:%0A$(head -c 6000 /tmp/ios.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            tail -n 20 /tmp/ios.log
          }
          trap finish EXIT
          sudo timeout 90 /tmp/runconfig /tmp/ios-client.json > /tmp/ios.log 2>&1 &
          sleep 5
          curl -fsS --max-time 20 https://www.google.com -o /dev/null -w "ios profile through tun: %{http_code}\n"
          grep -q "outbound/socks\[proxy\]" /tmp/ios.log || { echo "::error::iOS profile did not use the proxy"; exit 1; }

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Resources (icon + admin manifest)
        run: |
          go install github.com/akavel/rsrc@latest
          rsrc -manifest desktop/build/app.manifest -ico desktop/build/icon.ico -arch amd64 -o desktop/rsrc_windows_amd64.syso
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -tags "desktop,production,${CORE_TAGS}" \
            -ldflags "-s -w -H windowsgui -checklinkname=0 -X main.AppVersion=${VERSION} -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o "dist/Tainavpn-${VERSION}-windows-x64.exe" ./desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          retention-days: 3

  ubuntu:
    needs: version
    # built on 22.04 so the package also runs on Ubuntu 22.04 (older glibc); works on 24.04 too
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install GTK/WebKit
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Resolve modules
        run: go mod tidy
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          go build -trimpath -tags "desktop,production,webkit2_41,${CORE_TAGS}" \
            -ldflags "-s -w -checklinkname=0 -X main.AppVersion=${VERSION} -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o build/tainavpn ./desktop
      - name: Package .deb
        run: |
          P=pkg
          install -Dm755 build/tainavpn $P/usr/bin/tainavpn
          install -Dm644 desktop/linux/tainavpn.desktop $P/usr/share/applications/tainavpn.desktop
          install -Dm644 desktop/build/icon.png $P/usr/share/icons/hicolor/512x512/apps/tainavpn.png
          mkdir -p $P/DEBIAN
          cat > $P/DEBIAN/control <<EOF
          Package: tainavpn
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Tainavpn <noreply@tainavpn.local>
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libcap2-bin
          Section: net
          Priority: optional
          Installed-Size: $(du -sk $P/usr | cut -f1)
          Description: Tainavpn - весь трафик через прокси
           Отправляет трафик устройства в SOCKS5/HTTP-прокси (ядро sing-box).
          EOF
          sed -i 's/^          //' $P/DEBIAN/control
          cat > $P/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          # TUN mode needs network admin rights; grant them to the binary instead of running as root
          setcap cap_net_admin,cap_net_bind_service,cap_net_raw+ep /usr/bin/tainavpn || true
          command -v update-desktop-database >/dev/null && update-desktop-database -q || true
          exit 0
          EOF
          sed -i 's/^          //' $P/DEBIAN/postinst
          chmod 755 $P/DEBIAN/postinst
          mkdir -p dist
          dpkg-deb --root-owner-group --build $P "dist/tainavpn_${VERSION}_amd64.deb"
          dpkg-deb --info "dist/tainavpn_${VERSION}_amd64.deb"
      - name: Test install
        run: |
          sudo apt-get install -y "./dist/tainavpn_${VERSION}_amd64.deb"
          getcap /usr/bin/tainavpn | grep -q cap_net_admin
          test -f /usr/share/applications/tainavpn.desktop
          echo "installed ok"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: dist/*.deb
          retention-days: 3

  android:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Resolve modules
        run: |
          set -o pipefail
          go mod tidy 2>&1 | tee -a "$RUNNER_TEMP/out.log"
          go get golang.org/x/mobile/bind@${XMOBILE} 2>&1 | tee -a "$RUNNER_TEMP/out.log"
      - name: Install gomobile
        run: |
          set -o pipefail
          go install golang.org/x/mobile/cmd/gomobile@${XMOBILE} 2>&1 | tee -a "$RUNNER_TEMP/out.log"
          go install golang.org/x/mobile/cmd/gobind@${XMOBILE} 2>&1 | tee -a "$RUNNER_TEMP/out.log"
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Build Go library (AAR)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          set -o pipefail
          gomobile bind -v -target=android/arm64,android/arm,android/amd64 -androidapi 24 \
            -javapkg com.tainavpn -tags "${CORE_TAGS}" -trimpath \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o android/app/libs/tainacore.aar ./mobile 2>&1 | tee -a "$RUNNER_TEMP/out.log"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          APP_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          gradle -p android assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          test ${PIPESTATUS[0]} -eq 0
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Tainavpn-${VERSION}-android.apk"
          ls -la dist
      - name: Report errors
        if: failure()
        run: |
          grep -v "go: downloading\|go: finding\|go: found\|^go: upgraded\|^go: added" "$RUNNER_TEMP/out.log" 2>/dev/null | tail -n 30 | while IFS= read -r l; do echo "::error::$l"; done || true
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 "$RUNNER_TEMP/gradle.log" 2>/dev/null | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          retention-days: 3

  release:
    needs: [version, server, windows, ubuntu, android]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Remove old test builds (nightly)
        run: |
          gh release delete nightly -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
      - name: Publish release
        run: |
          ls -la artifacts
          cat > notes.md <<EOF
          ## Tainavpn ${VERSION}

          | Система | Файл |
          |---|---|
          | Windows 10/11 (64-bit) | \`Tainavpn-${VERSION}-windows-x64.exe\` — запускается без установки, попросит права администратора |
          | Android 7.0+ | \`Tainavpn-${VERSION}-android.apk\` |
          | Ubuntu 22.04 / 24.04 | \`tainavpn_${VERSION}_amd64.deb\` — открыть двойным кликом или \`sudo apt install ./tainavpn_${VERSION}_amd64.deb\` |

          Ядро: sing-box ${SINGBOX_VERSION}.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "v${VERSION}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Tainavpn ${VERSION}" --notes-file notes.md --latest \
            artifacts/Tainavpn-${VERSION}-windows-x64.exe \
            artifacts/Tainavpn-${VERSION}-android.apk \
            artifacts/tainavpn_${VERSION}_amd64.deb
      - name: Delete workflow artifacts (they are in the release now)
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true; done
