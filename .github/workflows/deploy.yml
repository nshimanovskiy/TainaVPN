name: Deploy server

# Обновляет tainavpn-server на VPS.
# Запускается автоматически из Build после успешных тестов, если менялся серверный код,
# или вручную кнопкой «Run workflow» во вкладке Actions.
on:
  workflow_dispatch:
    inputs:
      public_host:
        description: "Домен API (используется только при первом деплое, когда .env ещё нет)"
        default: "vpn.sdsds.top"
        required: true
  workflow_call:
    inputs:
      public_host:
        type: string
        default: "vpn.sdsds.top"

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.x"
  SINGBOX_VERSION: "1.14.2"
  # папка на сервере; по умолчанию в домашней папке пользователя деплоя (root и sudo не нужны).
  # Можно переопределить переменной репозитория VPS_DIR (Settings → Variables).
  REMOTE_DIR: ${{ vars.VPS_DIR || '~/tainavpn' }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build server
        env:
          CGO_ENABLED: "0"
        run: |
          go mod tidy
          go build -trimpath -ldflags "-s -w" -o deploy/tainavpn-server ./server/cmd/tainavpn-server
          go build -trimpath -ldflags "-s -w" -o deploy/tainavpn-bot ./bot
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${PORT:-22}"
          # resolve ~ on the server side
          DIR=$($SSH "$USER@$HOST" "mkdir -p $REMOTE_DIR/data $REMOTE_DIR/proxies $REMOTE_DIR/downloads && cd $REMOTE_DIR && pwd")
          echo "REMOTE_ABS=$DIR" >> $GITHUB_ENV
          scp -i ~/.ssh/id_deploy -P "${PORT:-22}" deploy/tainavpn-server deploy/tainavpn-bot deploy/Dockerfile deploy/docker-compose.yml deploy/.env.example deploy/proxies.example.txt "$USER@$HOST:$DIR/"
      - name: Restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
          PUBLIC_HOST: ${{ inputs.public_host }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" "$USER@$HOST" PUBLIC_HOST="$PUBLIC_HOST" REMOTE_DIR="$REMOTE_ABS" 'bash -s' <<'EOS'
          set -e
          cd "$REMOTE_DIR"
          # docker without root: either the user is in the "docker" group, or has passwordless sudo for docker
          if docker info >/dev/null 2>&1; then
            DOCKER="docker"
          elif sudo -n docker info >/dev/null 2>&1; then
            DOCKER="sudo -n docker"
          else
            echo "::error::Пользователь $(whoami) не может запускать docker. Один раз на сервере: sudo usermod -aG docker $(whoami)  (затем перелогиниться)"
            exit 1
          fi
          if [ ! -f .env ]; then
            TOKEN=$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')
            sed -e "s|^TVPN_PUBLIC_URL=.*|TVPN_PUBLIC_URL=https://$PUBLIC_HOST|" \
                -e "s|^TVPN_ADMIN_TOKEN=.*|TVPN_ADMIN_TOKEN=$TOKEN|" .env.example > .env
            chmod 600 .env
            echo "::notice::Создан $REMOTE_DIR/.env. Токен админки: grep ADMIN_TOKEN $REMOTE_DIR/.env"
          fi
          # --- migrate older .env files ---
          # admin panel moved to /adminadminadmin
          sed -i 's|^TVPN_ADMIN_PATH=/panel$|TVPN_ADMIN_PATH=/adminadminadmin|' .env
          # app self-registration was replaced by the Telegram bot
          sed -i '/^TVPN_OPEN_REGISTRATION=/d; /^TVPN_REGISTER_PER_DAY=/d; /^# true — приложение может само/d; /^# Сколько ключей в сутки/d' .env
          if ! grep -q '^TVPN_BOT_SECRET=' .env || grep -q '^TVPN_BOT_SECRET=CHANGE_ME' .env; then
            sed -i '/^TVPN_BOT_SECRET=/d' .env
            printf '\n# --- Telegram-бот ---\n# Общий секрет бота и сервера (создан автоматически)\nTVPN_BOT_SECRET=%s\n' "$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')" >> .env
          fi
          grep -q '^TVPN_BOT_TOKEN=' .env || printf '# Токен бота от @BotFather (пусто — бот не запускается)\nTVPN_BOT_TOKEN=\n' >> .env
          grep -q '^TVPN_BOT_ALLOWED=' .env || printf '# Кому бот выдаёт ссылки: Telegram ID или @username через запятую. Пусто — всем.\nTVPN_BOT_ALLOWED=\n' >> .env
          grep -q '^TVPN_BOT_TOKEN=.\+' .env || echo "::warning::Telegram-бот не настроен: впишите токен от @BotFather в $REMOTE_DIR/.env (TVPN_BOT_TOKEN=...) и выполните: cd $REMOTE_DIR && docker compose up -d"
          [ -e proxies/README.txt ] || cp proxies.example.txt proxies/README.txt
          $DOCKER compose up -d --build --force-recreate --remove-orphans
          sleep 3
          $DOCKER compose ps
          $DOCKER compose logs --tail 20
          P=$(grep -oP '^TVPN_API_LISTEN=.*:\K\d+' .env || echo 8090)
          curl -fsS http://127.0.0.1:$P/api/v1/info
          ADMIN=$(grep -oP '^TVPN_ADMIN_PATH=\K.*' .env || echo /adminadminadmin)
          curl -fsS -o /dev/null -w "admin panel $ADMIN: %{http_code}\n" http://127.0.0.1:$P$ADMIN
          EOS
