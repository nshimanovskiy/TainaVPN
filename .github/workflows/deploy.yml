name: Deploy server

# Кнопка «Run workflow» во вкладке Actions: собирает tainavpn-server и обновляет его на VPS.
on:
  workflow_dispatch:
    inputs:
      public_host:
        description: "Домен/IP VPS для SOCKS5 (используется только при первом деплое, когда .env ещё нет)"
        default: "vpn.sdsds.top"
        required: true

env:
  GO_VERSION: "1.25.x"
  SINGBOX_VERSION: "1.14.2"
  REMOTE_DIR: /opt/tainavpn

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build server
        env:
          CGO_ENABLED: "0"
        run: |
          go mod tidy
          go build -trimpath -tags "badlinkname,tfogo_checklinkname0" \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
            -o deploy/tainavpn-server ./server/cmd/tainavpn-server
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${PORT:-22}"
          $SSH "$USER@$HOST" "mkdir -p $REMOTE_DIR/data"
          scp -i ~/.ssh/id_deploy -P "${PORT:-22}" deploy/tainavpn-server deploy/Dockerfile deploy/docker-compose.yml deploy/.env.example "$USER@$HOST:$REMOTE_DIR/"
      - name: Restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
          PUBLIC_HOST: ${{ inputs.public_host }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" "$USER@$HOST" PUBLIC_HOST="$PUBLIC_HOST" REMOTE_DIR="$REMOTE_DIR" 'bash -s' <<'EOS'
          set -e
          cd "$REMOTE_DIR"
          if [ ! -f .env ]; then
            TOKEN=$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')
            sed -e "s|^TVPN_PUBLIC_HOST=.*|TVPN_PUBLIC_HOST=$PUBLIC_HOST|" \
                -e "s|^TVPN_PUBLIC_URL=.*|TVPN_PUBLIC_URL=https://$PUBLIC_HOST|" \
                -e "s|^TVPN_ADMIN_TOKEN=.*|TVPN_ADMIN_TOKEN=$TOKEN|" .env.example > .env
            chmod 600 .env
            echo "::notice::Создан $REMOTE_DIR/.env. Токен админки: ssh на сервер и 'grep ADMIN_TOKEN $REMOTE_DIR/.env'"
          fi
          docker compose up -d --build
          sleep 3
          docker compose ps
          docker compose logs --tail 20
          curl -fsS http://127.0.0.1:$(grep -oP '^TVPN_API_LISTEN=.*:\K\d+' .env || echo 8090)/api/v1/info
          EOS
