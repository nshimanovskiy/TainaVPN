<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tainavpn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="main">
  <header class="top">
    <div class="brand"><span class="logo"></span>Tainavpn</div>
    <button class="icon" id="openSettings" title="Настройки" aria-label="Настройки">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.1-1.64a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.48 1a7.3 7.3 0 0 0-1.68-.97l-.38-2.65A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.37 2.65c-.6.25-1.17.57-1.69.97l-2.48-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.64a7.8 7.8 0 0 0 0 1.94l-2.1 1.64a.5.5 0 0 0-.13.64l2 3.46c.13.22.39.31.6.22l2.49-1c.52.4 1.08.72 1.68.97l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.6-.25 1.17-.57 1.69-.97l2.48 1c.23.09.48 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.1-1.64Z"/></svg>
    </button>
  </header>

  <section class="hero">
    <button id="power" class="power" aria-label="Подключить">
      <svg viewBox="0 0 24 24" width="54" height="54"><path fill="currentColor" d="M13 3h-2v10h2V3Zm4.83 2.17-1.42 1.42A6.92 6.92 0 0 1 19 12a7 7 0 1 1-11.42-5.42L6.17 5.17A8.93 8.93 0 0 0 3 12a9 9 0 0 0 18 0c0-2.74-1.23-5.18-3.17-6.83Z"/></svg>
    </button>
    <div id="statusText" class="status">Отключено</div>
    <div id="statusSub" class="status-sub">&nbsp;</div>
  </section>

  <section class="list-head">
    <h2>Прокси</h2>
    <button id="openAdd" class="btn small">+ Добавить</button>
  </section>
  <ul id="profiles" class="profiles"></ul>
  <div id="empty" class="empty" hidden>
    <p>Прокси ещё нет.</p>
    <button id="quickGet" class="btn">Получить прокси с сервера</button>
  </div>
</main>

<!-- Add sheet -->
<div id="addSheet" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h3>Добавить прокси</h3><button class="icon close" data-close>✕</button></div>
    <div class="tabs">
      <button class="tab active" data-tab="server">С сервера</button>
      <button class="tab" data-tab="manual">Свой прокси</button>
    </div>
    <div class="tab-body" data-body="server">
      <button id="getFromServer" class="btn wide">Получить прокси с сервера</button>
      <p class="hint">или вставьте ссылку-подписку, которую выдал администратор</p>
      <input id="subUrl" placeholder="https://…/sub/ключ" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="addSub" class="btn ghost wide">Добавить по ссылке</button>
    </div>
    <div class="tab-body" data-body="manual" hidden>
      <input id="mLink" placeholder="логин:пароль@хост:порт" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="hint">или заполните поля</p>
      <div class="grid2">
        <input id="mName" placeholder="Название (необязательно)">
        <select id="mType"><option value="socks">SOCKS5</option><option value="http">HTTP</option></select>
      </div>
      <div class="grid2">
        <input id="mHost" placeholder="Хост / IP" autocapitalize="off" spellcheck="false">
        <input id="mPort" placeholder="Порт" inputmode="numeric">
      </div>
      <div class="grid2">
        <input id="mUser" placeholder="Логин (если есть)" autocapitalize="off" spellcheck="false">
        <input id="mPass" placeholder="Пароль" type="password">
      </div>
      <button id="addManual" class="btn wide">Сохранить</button>
    </div>
    <p id="addErr" class="err"></p>
  </div>
</div>

<!-- Settings sheet -->
<div id="settingsSheet" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h3>Настройки</h3><button class="icon close" data-close>✕</button></div>
    <label class="field">Адрес сервера Tainavpn
      <input id="serverUrl" autocapitalize="off" spellcheck="false">
    </label>
    <div id="modeBox" class="field" hidden>Режим
      <div class="seg">
        <button data-mode="tun">Весь трафик (TUN)</button>
        <button data-mode="proxy">Системный прокси</button>
      </div>
      <p class="hint" id="modeHint"></p>
    </div>
    <label class="check"><input type="checkbox" id="bypassLan"> Локальная сеть напрямую</label>
    <details class="logs"><summary>Логи ядра</summary><pre id="logs"></pre></details>
    <p class="hint" id="version"></p>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
