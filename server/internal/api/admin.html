<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tainavpn — панель</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e8eaf0; --muted:#8b91a1; --accent:#4f8cff; --bad:#ff5c6c; --ok:#3ccf8e; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1000px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  input { background:#0f1115; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font:inherit; min-width:0; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 14px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.danger { background:transparent; border:1px solid var(--bad); color:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td .row { gap:4px; }
  td button { padding:5px 9px; font-size:12px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .on { color:var(--ok); border-color:var(--ok); } .off { color:var(--bad); border-color:var(--bad); }
  .scroll { overflow-x:auto; }
  pre { white-space:pre-wrap; word-break:break-all; max-height:240px; overflow:auto; background:#0f1115; padding:10px; border-radius:8px; font-size:12px; }
  #login { max-width:380px; margin:12vh auto; }
</style>
</head>
<body>
<main>
  <div id="login" class="card" hidden>
    <h1>Tainavpn</h1>
    <p class="muted">Введите ADMIN_TOKEN</p>
    <div class="row"><input id="token" type="password" style="flex:1" autocomplete="current-password"><button id="loginBtn">Войти</button></div>
    <p id="loginErr" class="muted"></p>
  </div>

  <div id="app" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h1>Tainavpn — пользователи</h1>
      <button class="ghost" id="logout">Выйти</button>
    </div>
    <div class="card">
      <div id="status" class="muted">…</div>
    </div>
    <div class="card">
      <div class="row">
        <input id="newName" placeholder="Имя (например, Телефон Маши)" style="flex:1">
        <button id="create">Создать ключ</button>
      </div>
      <p class="muted" style="margin:10px 0 0">Ссылку-подписку вставьте в приложении: «Добавить → Ссылка с сервера».</p>
    </div>
    <div class="card scroll">
      <table>
        <thead><tr><th>Имя</th><th>Статус</th><th>Прокси</th><th>Последний вход</th><th>Ссылка</th><th></th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </div>
    <div class="card scroll">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <b>Прокси из папки</b>
        <button class="ghost" id="check">Проверить сейчас</button>
      </div>
      <p class="muted" id="dirHint" style="margin:0 0 8px"></p>
      <table>
        <thead><tr><th>Прокси</th><th>Тип</th><th>Состояние</th><th>Пользователей</th><th>Файл</th></tr></thead>
        <tbody id="proxies"></tbody>
      </table>
      <pre id="perr" hidden></pre>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem('tvpn_admin') || '';

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin('Неверный токен'); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function showLogin(msg) {
  $('app').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg || '';
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(t) { if (!t || t.startsWith('0001')) return '—'; return new Date(t).toLocaleString('ru-RU'); }

async function load() {
  const [users, st, px] = await Promise.all([api('GET', '/api/admin/users'), api('GET', '/api/admin/status'), api('GET', '/api/admin/proxies')]);
  $('login').hidden = true; $('app').hidden = false;
  $('status').innerHTML = `Прокси в пуле: <b>${st.proxies_alive}</b> рабочих из <b>${st.proxies_total}</b>` +
    (st.proxies_total === 0 ? ' <span style="color:var(--bad)">— добавьте прокси в папку на сервере</span>' : '') +
    ` · саморегистрация из приложения: ${st.open_registration ? 'включена' : 'выключена'}`;
  $('dirHint').innerHTML = `Файлы <code>*.txt</code> в папке <code>proxies</code> рядом с docker-compose.yml, по одному прокси в строке: <code>user:pass@host:port</code>. Изменения подхватываются за 10 секунд.`;
  $('proxies').innerHTML = px.proxies.map(p => `
    <tr>
      <td>${esc(p.host)}:${p.port}<div class="muted" style="font-size:12px">${esc(p.username || 'без логина')}</div></td>
      <td>${p.type === 'http' ? 'HTTP' : 'SOCKS5'}</td>
      <td>${!p.checked_at || p.checked_at.startsWith('0001') ? '<span class="pill">проверяется</span>' : p.alive ? '<span class="pill on">работает</span>' : `<span class="pill off">не работает</span><div class="muted" style="font-size:12px">${esc(p.error)}</div>`}</td>
      <td>${p.users}</td>
      <td class="muted">${esc(p.file)}:${p.line}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="muted">Папка пуста</td></tr>';
  $('perr').hidden = !px.errors.length;
  $('perr').textContent = px.errors.length ? 'Строки с ошибками:\n' + px.errors.join('\n') : '';
  $('users').innerHTML = users.map(u => `
    <tr>
      <td>${esc(u.name)}<div class="muted" style="font-size:12px">${esc(u.username)} · ${u.source === 'app' ? 'из приложения' : 'вручную'}</div></td>
      <td>${u.disabled ? '<span class="pill off">выключен</span>' : '<span class="pill on">активен</span>'}</td>
      <td>${u.proxy ? esc(u.proxy) + (u.proxy_alive ? '' : ' <span class="pill off">не работает</span>') : '<span class="muted">выдаётся при подключении</span>'}</td>
      <td>${fmt(u.last_seen)}<div class="muted" style="font-size:12px">${esc(u.last_ip || '')}</div></td>
      <td><button class="ghost" data-copy="${esc(u.subscription_url)}">Копировать</button></td>
      <td><div class="row">
        <button class="ghost" data-act="${u.disabled ? 'enable' : 'disable'}" data-id="${u.id}">${u.disabled ? 'Включить' : 'Выключить'}</button>
        <button class="ghost" data-act="reassign" data-id="${u.id}" title="Выдать другой прокси из папки (применится при следующем подключении)">Другой прокси</button>
        <button class="danger" data-act="delete" data-id="${u.id}">Удалить</button>
      </div></td>
    </tr>`).join('') || '<tr><td colspan="6" class="muted">Пока нет пользователей</td></tr>';
}

$('users').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy) { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Скопировано'; setTimeout(() => b.textContent = 'Копировать', 1200); return; }
  const id = b.dataset.id, act = b.dataset.act;
  try {
    if (act === 'delete') { if (!confirm('Удалить пользователя?')) return; await api('DELETE', '/api/admin/users/' + id); }
    else await api('POST', `/api/admin/users/${id}/${act}`);
    await load();
  } catch (err) { alert(err.message); }
});

$('check').onclick = async () => { await api('POST', '/api/admin/proxies/check'); $('check').textContent = 'Проверяется…'; setTimeout(() => { $('check').textContent = 'Проверить сейчас'; load().catch(() => {}); }, 9000); };

$('create').onclick = async () => {
  try {
    const u = await api('POST', '/api/admin/users', { name: $('newName').value });
    $('newName').value = '';
    await load();
    try { await navigator.clipboard.writeText(u.subscription_url); } catch {}
    alert('Ключ создан, ссылка скопирована:\n' + u.subscription_url);
  } catch (err) { alert(err.message); }
};

$('loginBtn').onclick = async () => { token = $('token').value.trim(); sessionStorage.setItem('tvpn_admin', token); try { await load(); } catch {} };
$('token').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logout').onclick = () => { token = ''; sessionStorage.removeItem('tvpn_admin'); showLogin(); };

if (token) load().catch(() => {}); else showLogin();
setInterval(() => { if (!$('app').hidden) load().catch(() => {}); }, 15000);
</script>
</body>
</html>
