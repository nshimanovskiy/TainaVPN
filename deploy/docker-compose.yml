services:
  tainavpn:
    build: .
    image: tainavpn-server:latest
    container_name: tainavpn
    restart: unless-stopped
    # API listens on 127.0.0.1 only and is published through nginx
    network_mode: host
    env_file: .env
    environment:
      TVPN_DATA_DIR: /data
      TVPN_PROXIES_DIR: /proxies
      TVPN_DOWNLOADS_DIR: /downloads
    volumes:
      - ./data:/data
      # app files for the home page downloads (uploaded by the release workflow)
      - ./downloads:/downloads:ro
      # put proxy lists here: *.txt files, one user:pass@host:port per line
      - ./proxies:/proxies:ro

  # Telegram bot: gives users their subscription link and the app files.
  # Needs TVPN_BOT_TOKEN (from @BotFather) in .env
  bot:
    image: tainavpn-server:latest
    container_name: tainavpn-bot
    restart: unless-stopped
    depends_on: [tainavpn]
    # talks to the API on 127.0.0.1
    network_mode: host
    env_file: .env
    entrypoint: ["/usr/local/bin/tainavpn-bot"]
    environment:
      TVPN_DOWNLOADS_DIR: /downloads
    volumes:
      # app files (exe/apk/deb), uploaded here by the release workflow
      - ./downloads:/downloads:ro
